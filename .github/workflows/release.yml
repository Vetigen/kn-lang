name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [bun-darwin-arm64, bun-darwin-x64, bun-linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} src/cli-knc.ts --outfile dist/knc-${{ matrix.target }}
          bun build --compile --target=${{ matrix.target }} src/cli-kn.ts --outfile dist/kn-${{ matrix.target }}
          tar -czf dist/kn-${{ matrix.target }}.tar.gz -C dist knc-${{ matrix.target }} kn-${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun build src/cli-knc.ts --outfile bin/knc --target bun
      - run: bun build src/cli-kn.ts --outfile bin/kn --target bun
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
